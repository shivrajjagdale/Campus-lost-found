<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">Campus Lost & Found</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>
</nav>

<section class="hero">
    <h1>Student Login</h1>
    <p>Login to manage your lost and found reports.</p>

    <div class="item-card" style="margin:30px auto; max-width:400px;">

        <input type="email" placeholder="Enter Email"
               style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="password" placeholder="Enter Password"
               style="width:100%; padding:14px; margin-bottom:20px; border:1px solid #ccc; border-radius:10px;">

        <button style="width:100%;">Login</button>

        <p style="margin-top:20px;">
            New student? <a href="#">Register</a>
        </p>

    </div>
</section>

<footer>
    <p>© 2026 Campus Lost & Found Management System</p>
</footer>

</body>
</html>
