<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">Campus Lost & Found</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="items.html">Items</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>Claim Item</h1>
    <p>Submit a request to claim this item.</p>

    <div class="item-card" style="margin:30px auto; max-width:450px;">

        <h2>Mobile Phone</h2>

        <p style="margin:15px 0;">
            Please provide details to help verify your claim.
        </p>

        <input type="text" placeholder="Your Full Name"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="email" placeholder="Your Email"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <textarea placeholder="Why do you believe this item belongs to you?"
        style="width:100%; height:120px; padding:14px; margin-bottom:20px; border:1px solid #ccc; border-radius:10px;"></textarea>

        <button type="button" style="width:100%;" onclick="alert('Claim request submitted successfully!')">
    Submit Claim Request
        </button>

    </div>
</section>

<footer>
    <p>© 2026 Campus Lost & Found Management System</p>
</footer>

</body>
</html>
