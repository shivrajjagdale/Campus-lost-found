<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">Campus Lost & Found</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>Create Account</h1>
    <p>Register as a campus student.</p>

    <div class="item-card" style="margin:30px auto; max-width:400px;">

        <input type="text" placeholder="Full Name"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="email" placeholder="Email"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="password" placeholder="Password"
        style="width:100%; padding:14px; margin-bottom:20px; border:1px solid #ccc; border-radius:10px;">

        <button style="width:100%;">Register</button>

        <p style="margin-top:20px;">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</section>

<footer>
    <p>© 2026 Campus Lost & Found Management System</p>
</footer>

</body>
  </html>
