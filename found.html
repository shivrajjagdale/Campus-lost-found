<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">Campus Lost & Found</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>Report Found Item</h1>
    <p>Enter the details of the item you found.</p>

    <div class="item-card" style="margin:30px auto; max-width:450px;">

        <input type="text" placeholder="Item Name"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="text" placeholder="Category"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="text" placeholder="Where did you find it?"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <input type="date"
        style="width:100%; padding:14px; margin-bottom:15px; border:1px solid #ccc; border-radius:10px;">

        <textarea placeholder="Description"
        style="width:100%; height:100px; padding:14px; margin-bottom:20px; border:1px solid #ccc; border-radius:10px;"></textarea>

        <button style="width:100%;">Submit Found Item</button>

    </div>
</section>

<footer>
    <p>© 2026 Campus Lost & Found Management System</p>
</footer>

</body>
</html>
